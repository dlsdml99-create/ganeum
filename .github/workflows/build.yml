# 가늠 APK 만들기: main에 올리면 자동으로 빌드 → 릴리스(다운로드 파일) → 다운로드 페이지 갱신
name: 가늠 APK 만들기
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'site/**', '.github/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
# 앱 빌드와 페이지만 올리기가 동시에 돌면 페이지가 예전 버전으로 덮일 수 있어 차례로 실행
concurrency: { group: release, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with: { gradle-version: '8.7' }
      - name: 서명 키 꺼내기 (GitHub 비밀값에만 있음, 저장소에는 없음)
        env: { SIGNING: '${{ secrets.GANEUM_SIGNING }}' }
        run: |
          if [ -z "$SIGNING" ]; then
            echo "::error::서명 키 비밀값(GANEUM_SIGNING)이 없어요. 저장소 Settings → Secrets and variables → Actions → New repository secret 에 넣어 주세요."
            exit 1
          fi
          echo "${SIGNING#*:}" | base64 -d > "$RUNNER_TEMP/ganeum.p12"
          echo "KEYSTORE=$RUNNER_TEMP/ganeum.p12" >> "$GITHUB_ENV"
          echo "::add-mask::${SIGNING%%:*}"
          echo "KEY_PASS=${SIGNING%%:*}" >> "$GITHUB_ENV"
      - name: APK 빌드
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          gradle assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk ganeum.apk
          rm -f "$KEYSTORE"
          ls -la ganeum.apk
          echo "MB=$(awk "BEGIN{printf \"%.1f\", $(stat -c%s ganeum.apk)/1048576}")" >> "$GITHUB_ENV"
      - name: 릴리스 올리기
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          N=${{ github.run_number }}
          sed -i "s/__N__/$N/g; s/__MB__/$MB/g" notes.md
          gh release delete "v$N" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$N" ganeum.apk --latest --title "가늠 v1.$N" --notes-file notes.md
      - name: 다운로드 페이지 올리기 (gh-pages)
        run: |
          N=${{ github.run_number }}
          # 아이폰 홈 화면에 추가했을 때 가늠 아이콘·이름이 보이게
          sed 's#<meta charset="utf-8">#<meta charset="utf-8"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-title" content="가늠"><meta name="apple-mobile-web-app-capable" content="yes">#' app/src/main/assets/index.html > site/app.html
          grep -q apple-touch-icon site/app.html
          # 웹앱 화면 코드(app.js)도 같이 올리고, 버전 표시를 앱(APK)과 같은 실제 번호로
          cp app/src/main/assets/app.js site/app.js
          sed -i "s/^const BUILD = '';/const BUILD = '1.$N';/" site/app.js
          grep -q "^const BUILD = '1.$N';" site/app.js
          grep -q '<script src="app.js"></script>' site/app.html
          sed -i "s#<script src=\"app.js\"></script>#<script src=\"app.js?v=$N\"></script>#" site/app.html
          grep -q "app.js?v=$N" site/app.html
          # 웹앱 오프라인: 서비스워커에 이번 번호를 넣어 저장분 이름을 'ganeum-번호'로 (다른 앱 저장분은 건드리지 않음)
          sed -i "s/__V__/$N/g" site/sw.js
          grep -q "const CACHE = 'ganeum-$N';" site/sw.js
          if grep -q "__V__" site/sw.js; then echo "::error::sw.js 번호가 채워지지 않았어요"; exit 1; fi
          sed -i "s/__N__/$N/g; s/__MB__/$MB/g" site/index.html
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "다운로드 페이지 v1.$N"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
          rm -rf .git
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: site }
  # Pages 설정을 'GitHub Actions'로 켜 둔 경우 여기서 바로 올라감 (gh-pages 방식이면 위에서 이미 올라감)
  pages:
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
