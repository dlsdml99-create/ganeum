# 다운로드 페이지만 다시 올리기 (앱은 다시 빌드하지 않음): site 폴더를 고치거나 직접 실행할 때
name: 가늠 다운로드 페이지
on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 최신 버전 번호로 페이지 채우기
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          N=$(gh release view --json tagName -q .tagName | tr -dc 0-9)
          MB=$(gh release view --json assets -q '.assets[0].size' | awk '{printf "%.1f", $1/1048576}')
          cp app/src/main/assets/index.html site/app.html
          sed -i "s/__N__/$N/g; s/__MB__/$MB/g" site/index.html
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "다운로드 페이지 v1.$N"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
          rm -rf .git
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  pages:
    needs: site
    runs-on: ubuntu-24.04
    continue-on-error: true
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
