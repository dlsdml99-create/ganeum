<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' file: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: file: https:; media-src 'self' data: blob:; connect-src 'self' https: data: blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>가늠 계산기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one phone column (max 440px) — readout grows from the top, preset strip + 4×5 keypad dock at the bottom, tab bar with the version at bottom-left */
:root{
  /* 지폐색 팔레트: 만원 jade(주요 동작) · 오만원 gold(자주 쓴 계산) · 오천원 brick(지우기·오류) · 천원 blue(환율) */
  --paper:#edf1ee;--sheet:#ffffff;--key:#ffffff;--key-edge:#cdd7d1;--key-press:#e1e8e4;
  --ink:#13201a;--ink-2:#55655d;--ink-3:#85938c;--line:#d5ded9;
  --jade:#13704f;--on-jade:#ffffff;--jade-soft:#d7e8de;--jade-ink:#0c5a3f;
  --gold:#946a06;--gold-soft:#f2e5c2;
  --brick:#b3402a;--blue:#2b5a97;--blue-soft:#dde6f2;
  --toast-bg:#13201a;--toast-fg:#eef3f0;--toast-act:#8fdcb9;
  --scrim:rgba(12,24,18,.42);--shadow:0 12px 32px rgba(18,40,30,.18);
  --ui:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;
  --num:-apple-system,BlinkMacSystemFont,"SF Pro Display",Roboto,"Segoe UI","Noto Sans",system-ui,sans-serif;
  --key-h:clamp(48px,7.4vh,68px);
}
@supports (height:1dvh){:root{--key-h:clamp(48px,7.4dvh,68px)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1512;--sheet:#18211d;--key:#1b2521;--key-edge:#0a0f0d;--key-press:#26322d;
  --ink:#e3ebe6;--ink-2:#9cada4;--ink-3:#6b7a73;--line:#26322c;
  --jade:#3aae80;--on-jade:#04150e;--jade-soft:#19302a;--jade-ink:#86dbb5;
  --gold:#e1b54a;--gold-soft:#342a10;
  --brick:#ef8068;--blue:#8db2e8;--blue-soft:#1a2637;
  --toast-bg:#e3ebe6;--toast-fg:#0e1512;--toast-act:#0c5a3f;
  --scrim:rgba(0,0,0,.6);--shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1512;--sheet:#18211d;--key:#1b2521;--key-edge:#0a0f0d;--key-press:#26322d;
  --ink:#e3ebe6;--ink-2:#9cada4;--ink-3:#6b7a73;--line:#26322c;
  --jade:#3aae80;--on-jade:#04150e;--jade-soft:#19302a;--jade-ink:#86dbb5;
  --gold:#e1b54a;--gold-soft:#342a10;
  --brick:#ef8068;--blue:#8db2e8;--blue-soft:#1a2637;
  --toast-bg:#e3ebe6;--toast-fg:#0e1512;--toast-act:#0c5a3f;
  --scrim:rgba(0,0,0,.6);--shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:14px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input{font:inherit;color:inherit;margin:0}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.offscreen{position:fixed;left:-9999px;top:0;opacity:0}

.app{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column}
.views{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column}

/* 계산기 화면 */
.v-calc{padding-block:4px 2px}
.hist{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 40px);mask-image:linear-gradient(to bottom,transparent,#000 40px)}
.hist::-webkit-scrollbar{display:none}
.hist-in{min-height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;gap:1px;padding-top:30px}
.hrow{display:flex;flex-wrap:wrap;justify-content:flex-end;column-gap:6px;max-width:100%;padding:4px 0;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink-3);text-align:right;overflow-wrap:anywhere}
.vset{display:flex;flex-direction:column;gap:8px}.vrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.vrow>span{min-width:36px;font-size:13px;color:var(--ink-2)}
.vrow .chip[aria-pressed="true"]{background:var(--jade);color:#fff;border-color:transparent}
.hrow b{font-weight:500;color:var(--ink-2)}
.hclear{align-self:flex-start;padding:4px 0;font-size:12px;color:var(--ink-3)}
.hclear.armed{color:var(--brick);font-weight:700}
.tips{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12.5px;line-height:1.45;color:var(--ink-3);text-align:right;word-break:keep-all}
.tips b{font-size:12px;font-weight:700;color:var(--ink-2)}
.readout{display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding-top:4px}
.prevline{min-height:21px;max-width:100%;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:16px;color:var(--ink-2);text-align:right;overflow-wrap:anywhere}
.expr{max-width:100%;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:var(--fs,50px);font-weight:300;line-height:1.1;letter-spacing:-.02em;text-align:right;overflow-wrap:anywhere;word-break:break-all}
.expr.done{font-weight:600;cursor:copy}
.expr .op{margin:0 .04em;color:var(--jade);font-weight:400}
.ph{color:var(--ink-3)}
.preview{min-height:28px;max-width:100%;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:22px;color:var(--ink-2);text-align:right;overflow-wrap:anywhere}
.preview.err{font-family:var(--ui);font-size:15px;font-weight:700;color:var(--brick)}
.meta{min-height:36px;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px}
.kor{font-size:13.5px;color:var(--ink-2)}
.cxbtn{height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-family:var(--num);font-variant-numeric:tabular-nums;font-size:14.5px;font-weight:600;white-space:nowrap}
.cxbtn small{font-size:11px;font-weight:500;opacity:.85}
.cxbtn.off{background:none;border:1px dashed var(--line);color:var(--ink-2);font-family:var(--ui)}
.cxswap{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:var(--blue)}
.cxswap svg{width:19px;height:19px}

/* 프리셋 칩 + 키패드 */
.pad{padding-block:6px 10px}
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 22px),transparent)}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;display:inline-flex;align-items:center;gap:7px;padding:0 14px;border-radius:999px;background:var(--key);border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.chip:active{background:var(--key-press)}
.chip.auto{background:var(--gold-soft);border-color:transparent;font-family:var(--num);font-variant-numeric:tabular-nums}
.chip.more{margin-right:18px;background:none;border-style:dashed;color:var(--ink-2);font-weight:500}
.coin{display:inline-block;flex:none;width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 2px var(--gold-soft),0 0 0 1px var(--gold)}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.k{height:var(--key-h);display:grid;place-items:center;border-radius:18px;background:var(--key);box-shadow:inset 0 -2px 0 var(--key-edge);font-family:var(--num);font-size:28px;font-weight:400;color:var(--ink);-webkit-touch-callout:none;transition:background-color .08s,transform .08s}
.k:active,.k.press{background:var(--key-press);transform:translateY(1px);box-shadow:none}
.k-op{background:var(--jade-soft);color:var(--jade-ink);box-shadow:none;font-size:31px}
.k-op:active,.k-op.press{background:var(--jade-soft);filter:brightness(.93)}
.k-fn{color:var(--ink-2);font-size:25px}
.k-clr{color:var(--brick);font-size:21px;font-weight:700;letter-spacing:.02em}
.k-eq{background:var(--jade);color:var(--on-jade);box-shadow:none;font-size:34px}
.k-eq:active,.k-eq.press{background:var(--jade);filter:brightness(1.12)}
.k svg{width:27px;height:27px}

/* 탭 바 — 좌측 하단 버전 */
.tabs{display:grid;grid-template-columns:44px repeat(3,minmax(0,1fr)) 44px;height:58px;border-top:1px solid var(--line);background:var(--paper)}
.ver{align-self:end;justify-self:start;padding:0 4px 9px 0;font-family:var(--num);font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink-3)}
.ver.new{color:#F5B400;font-weight:800;text-shadow:0 0 1px rgba(0,0,0,.35)}
.vtag.up{background:rgba(245,180,0,.18)!important;color:#F5B400!important}.upv{color:#F5B400}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--ink-3)}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--jade);font-weight:700}

/* 환율·프리셋 화면 머리 */
.vhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 4px}
.vhead h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.02em}
.hbtns{display:flex;gap:2px;margin-right:-8px}
.iconbtn{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;color:var(--ink-2)}
.iconbtn:active{background:var(--key-press)}
.iconbtn svg{width:22px;height:22px}
.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 환율 */
.fxstatus{display:flex;align-items:center;gap:7px;margin:0 0 6px;font-size:12.5px;color:var(--ink-2)}
.dot{width:7px;height:7px;flex:none;border-radius:50%;background:var(--ink-3)}
.dot.live{background:var(--jade)}
.fxlist{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;list-style:none;margin:0 -10px;padding:0}
.fxrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px;border-radius:14px;cursor:pointer}
.fxrow:not(.on)+.fxrow:not(.on){box-shadow:inset 0 1px 0 var(--line)}
.fxrow.on{background:var(--jade-soft)}
.flag{font-size:25px;line-height:1;text-align:center}
.cinfo{min-width:0;display:flex;flex-direction:column;gap:1px}
.code{font-family:var(--num);font-size:16px;font-weight:700;letter-spacing:.03em}
.cname{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cval{min-width:0;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.amt{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:23px;font-weight:500;white-space:nowrap}
.fxrow.on .amt{font-size:26px;font-weight:700;color:var(--jade-ink)}
.fxrow .amt.m{font-size:19px}
.fxrow .amt.s{font-size:16px}
.amt .op{color:var(--jade)}
.rate{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.caret{display:inline-block;width:2px;height:.9em;margin-left:3px;vertical-align:-.08em;background:var(--jade);animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.fxfoot{display:flex;flex-direction:column;gap:6px;padding:6px 10px 14px}
.addcur{align-self:flex-start;height:40px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--jade)}
.addcur svg{width:18px;height:18px}
.credit{margin:0;font-size:11.5px;line-height:1.55;color:var(--ink-3);word-break:keep-all}
.credit a{color:inherit}

/* 프리셋 */
.plist{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:18px}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:18px 0 4px;font-size:12.5px;font-weight:700;letter-spacing:.02em;color:var(--ink-2)}
.sect small{font-size:11.5px;font-weight:500;color:var(--ink-3)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.pmain{display:block;min-width:0;padding:12px 0;text-align:left}
.pname{display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:700}
.pform{display:block;margin-top:3px;font-family:var(--num);font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.pnote{display:block;margin-top:2px;font-size:12px;color:var(--ink-3);word-break:keep-all}
.pact{display:flex;align-items:center;gap:2px}
.star[aria-pressed="true"]{color:var(--gold)}
.star[aria-pressed="true"] svg{fill:currentColor}
.lrow .pname{font-family:var(--num);font-variant-numeric:tabular-nums}
.empty{margin:6px 0 0;padding:12px 14px;border:1px dashed var(--line);border-radius:14px;font-size:13px;line-height:1.55;color:var(--ink-2);word-break:keep-all}
.linkbtn{margin-top:14px;font-size:13px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}

/* 버튼 */
.btn{height:50px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 18px;border-radius:14px;font-size:15px;font-weight:700}
.btn svg{width:18px;height:18px}
.btn.sm{height:38px;padding:0 14px;border-radius:12px;font-size:14px}
.btn.pri{background:var(--jade);color:var(--on-jade)}
.btn.sec{border:1px solid var(--line);color:var(--ink)}
.btn.danger{border:1px solid var(--line);color:var(--brick)}
.btn:active{filter:brightness(.94)}

/* 아래에서 올라오는 창 */
.sheetwrap{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .18s}
.sheet{position:relative;width:100%;max-width:440px;max-height:88%;overflow-y:auto;overscroll-behavior:contain;background:var(--sheet);border-radius:22px 22px 0 0;box-shadow:var(--shadow);padding-block:10px max(18px,env(safe-area-inset-bottom,0px));transform:translateY(28px);opacity:0;transition:transform .2s ease,opacity .2s ease}
.sheet:focus{outline:none}
.sheetwrap.on .scrim{opacity:1}
.sheetwrap.on .sheet{transform:none;opacity:1}
.grab{width:38px;height:4px;margin:0 auto 12px;border-radius:2px;background:var(--line)}
.shead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.shead h2{margin:6px 0 0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.vtag{margin-left:8px;padding:2px 8px;border-radius:999px;background:var(--jade-soft);color:var(--jade-ink);font-family:var(--num);font-size:13px;vertical-align:3px}
.hint{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink-2);word-break:keep-all}
.hint.err{font-weight:700;color:var(--brick)}
.field{display:grid;grid-template-columns:minmax(0,7em) minmax(0,1fr);align-items:center;gap:10px;margin-top:10px}
.field label{font-size:14px;font-weight:700;color:var(--ink-2);overflow-wrap:anywhere}
.field label small{display:block;font-size:11px;font-weight:500;color:var(--ink-3)}
.lbl{display:block;margin:16px 0 6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.lbl small{font-weight:500;color:var(--ink-3)}
.inp{width:100%;height:48px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font-family:var(--num);font-variant-numeric:tabular-nums;font-size:20px;text-align:right}
.inp.txt{font-family:var(--ui);font-size:16px;text-align:left}
.inp:focus{outline:none;border-color:var(--jade);box-shadow:0 0 0 3px var(--jade-soft)}
.res{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.res span{flex:none;font-size:14px;color:var(--ink-2)}
.res b{min-width:0;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:30px;font-weight:700;text-align:right;overflow-wrap:anywhere}
.res b.bad{font-family:var(--ui);font-size:15px;color:var(--brick)}
.btns{display:flex;gap:10px;margin-top:16px}
.btns .pri{flex:1}
.syms{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-top:8px}
.sym{min-width:0;height:40px;padding:0;border-radius:10px;background:var(--jade-soft);color:var(--jade-ink);font-family:var(--num);font-size:18px;font-weight:600}
.suggest{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--gold-soft);text-align:left}
.suggest b{font-family:var(--num);font-size:16px}
.suggest span{font-size:12px;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cchip{height:36px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-family:var(--num);font-size:14px;font-weight:700}
.cchip[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.switch{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;font-size:15px;font-weight:600;text-align:left}
.switch i{position:relative;flex:none;width:46px;height:28px;border-radius:999px;background:var(--line);transition:background-color .15s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--sheet);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"] i{background:var(--jade)}
.switch[aria-checked="true"] i::after{transform:translateX(18px)}
.curlist{list-style:none;margin:8px 0 0;padding:0}
.curitem{width:100%;display:grid;grid-template-columns:30px 3.4em minmax(0,1fr) 26px;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line);text-align:left}
.curitem .ck{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--line);color:transparent}
.curitem[aria-pressed="true"] .ck{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.curitem .ck svg{width:15px;height:15px}
.notes{margin:4px 0 0;padding:0;list-style:none}
.notes>li{padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.55}
.notes b{font-family:var(--num)}
.notes span{margin-left:6px;font-size:12px;color:var(--ink-3)}
.notes ul{margin:4px 0 0;padding-left:18px;color:var(--ink-2)}

/* 식 중간 고치기 · 괄호 */
.expr .tn{cursor:pointer;border-radius:8px}
.expr .tn.sel{background:var(--jade-soft);color:var(--jade-ink);box-shadow:0 0 0 3px var(--jade-soft)}
.prevline.can{cursor:pointer}
.fix{margin-left:8px;padding:2px 9px;border-radius:999px;background:var(--jade-soft);color:var(--jade-ink);font-family:var(--ui);font-size:12px;font-weight:700;vertical-align:2px}
.padtop{display:flex;align-items:flex-start;gap:8px}
.padtop .strip{flex:1;min-width:0}
.parbtn{flex:none;height:36px;padding:0 13px;border-radius:12px;background:var(--jade-soft);color:var(--jade-ink);font-family:var(--num);font-size:17px;font-weight:600;letter-spacing:.1em}
.parbtn:active{filter:brightness(.93)}
/* 프리셋 묶음 · 공유 */
.packs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.pack{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px;border:1px solid var(--line);border-radius:14px;text-align:left}
.pack:active{background:var(--key-press)}
.pack b{font-size:15px}
.pack span{font-size:12px;line-height:1.4;color:var(--ink-2);word-break:keep-all}
.pack small{font-size:11.5px;font-weight:700;color:var(--jade-ink)}
.pack.imp{border-style:dashed}
.added{padding:0 10px;font-size:12.5px;font-weight:700;color:var(--ink-3)}
.sharebox{margin:12px 0 0;padding:12px;border-radius:12px;background:var(--paper);font-size:13.5px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.ta{width:100%;min-height:96px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit;font-size:14px;resize:vertical}
.ta:focus{outline:none;border-color:var(--jade);box-shadow:0 0 0 3px var(--jade-soft)}
.btn:disabled{opacity:.45}

/* 알림 */
.toast{position:absolute;top:10px;left:50%;z-index:40;display:flex;align-items:center;gap:14px;width:max-content;max-width:calc(100% - 32px);padding:10px 14px;border-radius:14px;background:var(--toast-bg);color:var(--toast-fg);box-shadow:var(--shadow);font-size:14px;line-height:1.4;word-break:keep-all;opacity:0;transform:translate(-50%,-8px);transition:opacity .16s,transform .16s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{flex:none;font-weight:700;color:var(--toast-act)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

function renderMeta(val) {

}

/* 환율 탭도 계산기처럼 결과를 복사: "100 USD = 133,804원 = 15,788 JPY …" */
function fxText() {

function fxSelect(code, force) {
  const fx = S.fx;

  const nv = v == null ? null : conv(v, fx.active, code);

  changed();
}

/* ───── 아래에서 올라오는 창 ───── */
let sheetOpen = false, lastFocus = null;
function openSheet(html, mount) {
  lastFocus = document.activeElement;
  el.sheet.innerHTML = '<div class="sheet-in">' + html + '</div>';
  el.sheet.scrollTop = 0;
  el.sheetWrap.hidden = false;
  sheetOpen = true;
  requestAnimationFrame(() => requestAnimationFrame(() => el.sheetWrap.classList.add('on')));
  if (mount) mount(el.sheet.firstElementChild);
  try { el.sheet.focus({ preventScroll: true }); } catch (e) { /* 무시 */ }
}
function closeSheet() {
  if (!sheetOpen) return;
  sheetOpen = false;
  el.sheetWrap.classList.remove('on');
  setTimeout(() => { if (!sheetOpen) { el.sheetWrap.hidden = true; el.sheet.innerHTML = ''; } }, 200);
  if (lastFocus && lastFocus.focus) { try { lastFocus.focus({ preventScroll: true }); } catch (e) { /* 무시 */ } }
}

function sheetPresetCalc(p, x0) {
  const info = presetInfo(p);
  if (info.err) return sheetPresetEdit(p);
  const fromPreset = S.tab === 'preset', target = S.tab === 'fx' ? S.fx : S.calc;
  const xv = x0 != null ? x0 : edValue(target);
  const vals = Object.assign({}, p.vals);
  if (info.primary && xv != null) vals[info.primary] = xv;
  const fields = info.vars.map((v, i) => `<div class="field"><label for="pv${i}">${esc(varLabel(v))}${i === 0 && xv != null ? `<small>${S.tab === 'fx' ? '환율 화면 값' : '계산기 값'}</small>` : ''}</label><input class="inp" id="pv${i}" data-var="${esc(v)}" inputmode="decimal" autocomplete="off" enterkeyhint="done" value="${typeof vals[v] === 'number' ? esc(String(vals[v])) : ''}"></div>`).join('');
  openSheet(`<div class="grab"></div>
    <div class="shead"><div><h2>${esc(p.name)}</h2>${p.note ? `<p class="hint">${esc(p.note)}</p>` : ''}</div>${CLOSE}</div>
    <p class="pform">${esc(prettyFormula(p.f))}</p>
    ${fields}
    <div class="res"><span>결과</span><b id="pres">–</b></div>
    <div class="btns"><button class="btn sec" type="button" data-act="pcopy">복사</button><button class="btn pri" type="button" data-act="papply">${S.tab === 'fx' ? '환율에 넣기' : '계산기에 넣기'}</button></div>`, sh => {
    const inputs = Array.from(sh.querySelectorAll('input[data-var]'));
    const out = $('#pres', sh);
    let result = null, cur = {};
    const upd = () => {
      cur = {}; let bad = '';
      inputs.forEach(inp => {
        const raw = inp.value.trim(), name = varLabel(inp.dataset.var);
        if (!raw) { bad = bad || `${name} 값을 넣어 주세요`; return; }
        try { cur[inp.dataset.var] = calc(raw); } catch (e) { bad = bad || `${name}: ${e.message}`; }
      });
      if (!bad) { try { result = presetRound(p, calc(p.f, cur)); } catch (e) { bad = e.message; } }
      if (bad) { result = null; out.textContent = bad; out.className = 'bad'; } else { out.textContent = fmt(result); out.className = ''; }
    };
    inputs.forEach(i => i.addEventListener('input', upd));
    upd();
    $('[data-act="papply"]', sh).addEventListener('click', () => {
      if (result == null) { const empty = inputs.find(i => !i.value.trim()); if (empty) empty.focus(); return; }
      /* 미리 채워 둔 값(할인율·인원·배송비 등)만 이번 값으로 기억. 계산기 숫자나 매번 넣는 값은 기억하지 않아요 */
      info.secondary.forEach(v => { if (p.vals && typeof p.vals[v] === 'number') p.vals[v] = cur[v]; });
      const label = recLabel(p, cur), r = result;
      closeSheet();
      if (fromPreset) S.tab = 'calc';
      commit(fromPreset ? S.calc : editor(), r, { l: label, x: info.primary ? cur[info.primary] : null });
    });
    $('[data-act="pcopy"]', sh).addEventListener('click', () => { if (result != null) copyText(String(result)); });
    const empty = inputs.find(i => !i.value.trim());
    if (empty) setTimeout(() => empty.focus(), 230);
  });
}

function sheetPresetEdit(p, seed) {
  const sug = p ? null : (seed || lastLearnable());
  const symMap = { '□': '□', '×': ' × ', '÷': ' ÷ ', '+': ' + ', '−': ' − ', '(': '(', ')': ')', '%': '%' };
  openSheet(`<div class="grab"></div>
    <div class="shead"><h2>${p ? '프리셋 고치기' : '새 프리셋'}</h2>${CLOSE}</div>
    ${sug ? `<button class="suggest" type="button" data-act="sug"><span>방금 한 계산으로 만들기</span><b>${esc(prettyExpr(sug.e))}</b><span>앞 숫자 자리에 어떤 값이든 넣어 쓸 수 있게 바꿔 줘요</span></button>` : ''}
    <label class="lbl" for="peF">계산식</label>
    <input class="inp txt" id="peF" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="120" placeholder="예: 가격 × (1 − 할인율 ÷ 100)" value="${p ? esc(p.f) : ''}">
    <div class="syms" id="peSyms">${Object.keys(symMap).map(c => `<button class="sym" type="button" data-sym="${c}">${c}</button>`).join('')}</div>
    <p class="hint">가격·인원처럼 이름을 쓰면 입력칸이 저절로 생겨요. 첫 번째 이름에는 계산기 숫자가 들어가요. □는 ‘지금 숫자’라는 뜻이에요.</p>
    <div id="peVars"></div>
    <label class="lbl" for="peName">이름 <small>비워 두면 계산식으로 지어요</small></label>
    <input class="inp txt" id="peName" maxlength="20" autocomplete="off" placeholder="예: 택배비 포함" value="${p ? esc(p.name) : ''}">
    <p class="hint" id="peCheck" aria-live="polite"></p>
    <div class="btns">${p ? '<button class="btn danger" type="button" data-act="pdel">삭제</button>' : ''}<button class="btn pri" type="button" data-act="psave">저장</button></div>`, sh => {
    const fIn = $('#peF', sh), nIn = $('#peName', sh), box = $('#peVars', sh), chk = $('#peCheck', sh);
    const dv = Object.assign({}, p ? p.vals : {});
    let vars = null, sig = null;
    const readDefaults = () => box.querySelectorAll('input[data-var]').forEach(i => {
      const raw = i.value.trim();
      if (!raw) delete dv[i.dataset.var];
      else { try { dv[i.dataset.var] = calc(raw); } catch (e) { /* 입력 중 */ } }
    });
    const say = (msg, bad) => { chk.textContent = msg; chk.className = bad ? 'hint err' : 'hint'; };
    function upd() {
      readDefaults();
      const f = fIn.value.trim();
      if (!f) { vars = null; sig = ''; box.innerHTML = ''; say(''); return; }
      try { vars = compile(f).vars; } catch (e) { vars = null; say(e.message, true); return; }
      const sec = vars.slice(1), nsig = sec.join('\u0001');
      if (nsig !== sig) {
        sig = nsig;
        box.innerHTML = sec.length ? '<p class="lbl">미리 채워 둘 값 <small>계산할 때 바꿀 수 있어요</small></p>' + sec.map((v, i) => `<div class="field"><label for="pd${i}">${esc(varLabel(v))}</label><input class="inp" id="pd${i}" data-var="${esc(v)}" inputmode="decimal" autocomplete="off" value="${typeof dv[v] === 'number' ? esc(String(dv[v])) : ''}"></div>`).join('') : '';
      }
      const x = edValue(S.calc), sample = x != null && x !== 0 ? x : 10000;
      const vals = Object.assign({}, dv);
      if (vars[0]) vals[vars[0]] = sample;
      const missing = sec.filter(v => typeof vals[v] !== 'number');
      if (missing.length) return say(`✓ 계산식 확인 · ${missing.map(varLabel).join(', ')} 값은 계산할 때 넣어요`);
      try {
        const r = calc(f, vals);
        say(vars.length ? `✓ 예) ${varLabel(vars[0])} ${fmt(sample)} → ${fmt(r)}` : `✓ 결과 ${fmt(r)}`);
      } catch (e) { say(e.message, true); }
    }
    fIn.addEventListener('input', upd);
    box.addEventListener('input', upd);
    const syms = $('#peSyms', sh);
    syms.addEventListener('pointerdown', e => { if (e.target.closest('[data-sym]')) e.preventDefault(); });
    syms.addEventListener('click', e => {
      const b = e.target.closest('[data-sym]');
      if (!b) return;
      const t = symMap[b.dataset.sym], s = fIn.selectionStart == null ? fIn.value.length : fIn.selectionStart, en = fIn.selectionEnd == null ? s : fIn.selectionEnd;
      fIn.value = fIn.value.slice(0, s) + t + fIn.value.slice(en);
      fIn.focus();
      try { fIn.setSelectionRange(s + t.length, s + t.length); } catch (er) { /* 무시 */ }
      upd();
    });
    const sb = $('[data-act="sug"]', sh);
    if (sb) sb.addEventListener('click', () => {
      fIn.value = prettyFormula('□' + sug.tail);
      if (!nIn.value.trim()) nIn.value = prettyExpr(sug.tail);
      sb.remove();
      upd();
    });
    if (sb && seed) sb.click();
    $('[data-act="psave"]', sh).addEventListener('click', () => {
      upd();
      const f = fIn.value.trim();
      if (!f) { say('계산식을 넣어 주세요', true); fIn.focus(); return; }
      if (!vars) { fIn.focus(); return; }
      const vals = {};
      vars.slice(1).forEach(v => { if (typeof dv[v] === 'number') vals[v] = dv[v]; });
      const name = (nIn.value.trim() || prettyFormula(f)).slice(0, 24);
      if (p) {
        if (p.f !== f) { delete p.chip; delete p.order; delete p.note; }
        p.f = f; p.name = name; p.vals = vals;
      } else S.presets.push({ id: 'u' + Date.now().toString(36), name, f, vals, pin: true });
      closeSheet();
      changed();
      toast(p ? '고쳤어요' : '저장했어요 · 계산기 칩에 나와요');
    });
    const del = $('[data-act="pdel"]', sh);
    if (del) {
      let armed = false, t = 0;
      del.addEventListener('click', () => {
        if (!armed) { armed = true; del.textContent = '한 번 더 누르면 삭제'; t = setTimeout(() => { armed = false; del.textContent = '삭제'; }, 3000); return; }
        clearTimeout(t);
        const i = S.presets.indexOf(p);
        if (i >= 0) S.presets.splice(i, 1);
        closeSheet();
        changed();
        toast('삭제했어요');
      });
    }
    upd();
    if (!p && (!sug || seed)) setTimeout(() => fIn.focus(), 230);
  });
}

function sheetPack(k) {
  const has = it => S.presets.some(p => p.id === it.id);
  openSheet(`<div class="grab"></div>
    <div class="shead"><div><h2>${esc(k.name)} 묶음</h2><p class="hint">넣은 프리셋은 ★를 켜면 계산기 칩에 나와요.</p></div>${CLOSE}</div>
    <div id="pkList"></div>
    <div class="btns"><button class="btn pri" type="button" data-act="pkall"></button></div>`, sh => {
    const draw = () => {
      $('#pkList', sh).innerHTML = k.items.map(i => `<div class="prow"><div class="pmain"><span class="pname">${esc(i.name)}</span><span class="pform">${esc(prettyFormula(i.f))}</span>${i.note ? `<span class="pnote">${esc(i.note)}</span>` : ''}</div><div class="pact">${has(i) ? '<span class="added">넣음</span>' : `<button class="btn sec sm" type="button" data-add="${i.id}">넣기</button>`}</div></div>`).join('');
      const left = k.items.filter(i => !has(i)).length, all = $('[data-act="pkall"]', sh);
      all.disabled = !left;

/* ───── 프리셋 공유: 링크 하나에 계산식을 담는다 ───── */
function encPreset(p) {
  const o = { n: p.name, f: p.f }, v = {};
  presetInfo(p).secondary.forEach(k => { if (p.vals && typeof p.vals[k] === 'number') v[k] = p.vals[k]; });
  if (Object.keys(v).length) o.v = v;
  if (p.chip) o.c = p.chip;
  if (typeof p.dp === 'number') o.d = p.dp;
  if (p.note) o.t = p.note;
  if (Array.isArray(p.order)) o.o = p.order;
  let bin = '';
  new TextEncoder().encode(JSON.stringify(o)).forEach(x => { bin += String.fromCharCode(x); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decPreset(text) {
  const m = /p\.html#([A-Za-z0-9_-]{8,2400})/.exec(text) || /^([A-Za-z0-9_-]{8,2400})$/.exec(String(text).trim());
  if (!m) return null;
  try {
    const b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
    const bytes = Uint8Array.from(atob(b64 + '='.repeat((4 - b64.length % 4) % 4)), c => c.charCodeAt(0));
    const o = JSON.parse(new TextDecoder().decode(bytes));
    if (!o || typeof o.n !== 'string' || typeof o.f !== 'string') return null;
    const name = o.n.trim().slice(0, 24), f = o.f.trim();
    if (!name || !f || f.length > 120) return null;
    const vars = compile(f).vars;
    const p = { id: 's' + Date.now().toString(36), name, f, vals: {}, pin: true };
    if (o.v && typeof o.v === 'object') vars.slice(1).forEach(k => { if (hasOwn(o.v, k) && typeof o.v[k] === 'number' && isFinite(o.v[k])) p.vals[k] = o.v[k]; });
    if (typeof o.c === 'string' && o.c.length <= 30) p.chip = o.c;
    if (o.d === 0 || o.d === 1 || o.d === 2) p.dp = o.d;
    if (typeof o.t === 'string') p.note = o.t.slice(0, 80);
    if (Array.isArray(o.o)) p.order = o.o.filter(x => typeof x === 'string' && vars.includes(x));
    return p;
  } catch (e) { return null; }
}
function shareText(p) {

}

}

function copyText(text, msg) {
  const ok = () => toast(msg || `${fmt(+text)} 복사했어요`);
  if (NATIVE && NATIVE.copy) { try { NATIVE.copy(String(text)); return ok(); } catch (e) { /* 아래 방법으로 */ } }
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.className = 'offscreen';
    document.body.appendChild(ta); ta.select();
    let done = false;
    try { done = document.execCommand('copy'); } catch (e) { done = false; }
    ta.remove();
    if (done) ok(); else toast('이 화면에서는 복사가 안 돼요');
  };
  try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
}

/* ───── 인터넷: 환율 받기 · 새 버전 확인 ───── */
const fxWait = {};
let fxSeq = 0;
window.__fetchDone = (id, text) => { const w = fxWait[id]; if (!w) return; delete fxWait[id]; try { if (text == null) throw new Error('fail'); w.res(JSON.parse(text)); } catch (e) { w.rej(e); } };
function fetchJSON(url, ms) {
  if (NATIVE && NATIVE.fetchAsync) return new Promise((res, rej) => { const id = 'f' + (++fxSeq); fxWait[id] = { res, rej }; NATIVE.fetchAsync(id, url); setTimeout(() => window.__fetchDone(id, null), (ms || 7000) + 3000); });
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), ms || 7000) : 0;
  return fetch(url, { cache: 'no-store', credentials: 'omit', signal: ctl ? ctl.signal : undefined })
    .then(r => { clearTimeout(timer); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .catch(e => { clearTimeout(timer); throw e; });
}
async function refreshRates(manual) {
  if (APP.preview) { if (manual) toast('미리보기에서는 저장된 환율로 계산해요. 앱에서는 자동으로 새 환율을 받아요'); return; }
  if (fxBusy) return;
  fxBusy = true;
  if (S.tab === 'fx') renderFxStatus();
  let ok = false;
  for (const src of RATE_SOURCES) {
    try {
      const d = src.read(await fetchJSON(src.url, 7000));
      if (d && d.r && d.r.KRW > 0 && d.r.EUR > 0) {
        const r = {};
        Object.keys(d.r).forEach(k => { const v = +d.r[k]; if (hasOwn(CUR, k) && v > 0 && isFinite(v)) r[k] = v; });
        r.USD = 1;
        S.rates = { r, at: d.at || Date.now(), src: src.id, got: Date.now() };
        ok = true;
        break;
      }
    } catch (e) { /* 다음 곳에서 시도 */ }
  }
  fxBusy = false;
  if (ok) save();
  render();
  if (manual) toast(ok ? '최신 환율로 바꿨어요' : '지금은 새 환율을 못 받았어요. 저장된 환율로 계산해요');
}
let lastTry = 0;
function autoRefresh() {
  if (APP.preview || Date.now() - (S.rates.got || 0) < 3 * 3600e3 || Date.now() - lastTry < 10 * 60e3) return;
  lastTry = Date.now();
  refreshRates(false);
}
function newer(a, b) {
  const pa = String(a).replace(/^v/i, '').split('.').map(Number), pb = String(b).replace(/^v/i, '').split('.').map(Number);
  for (let i = 0; i < 3; i++) { const d = (pa[i] || 0) - (pb[i] || 0); if (d) return d > 0; }
  return false;
}
async function checkUpdate() {
  if (!APP.updateUrl) return null;
  try {
    const j = await fetchJSON(APP.updateUrl + '?t=' + Date.now(), 7000);
    if (j && typeof j.version === 'string' && typeof j.apk === 'string' && /^https:\/\//.test(j.apk) && newer(j.version, APP.version)) return j;
  } catch (e) { /* 확인 실패 */ }
  return null;
}
function autoUpdateCheck() {
  if (!APP.updateUrl || Date.now() - (S.upd || 0) < 12 * 3600e3) return;
  S.upd = Date.now(); save();
  checkUpdate().then(u => { if (u) toast(`새 버전 ${u.version}이 나왔어요`, ['받기', () => { window.open(u.apk, '_blank', 'noopener'); }]); });
}

/* ───── 이벤트 ───── */
let holdTimer = 0, held = false;
el.keys.addEventListener('pointerdown', e => {
  if (!e.target.closest('[data-k="BS"]')) return;
  held = false;
  holdTimer = setTimeout(() => { held = true; press('AC'); }, 480);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach(t => el.keys.addEventListener(t, () => clearTimeout(holdTimer)));
el.keys.addEventListener('contextmenu', e => e.preventDefault());
el.keys.addEventListener('click', e => {
  const b = e.target.closest('[data-k]');
  if (!b) return;
  if (b.dataset.k === 'BS' && held) { held = false; return; }
  press(b.dataset.k);
});
el.strip.addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) chipTap(b); });
$('#parbtn').addEventListener('click', () => press('()'));
el.tabs.addEventListener('click', e => {
  const b = e.target.closest('[data-tab]');
  if (b) setTab(b.dataset.tab);
  else if (e.target.closest('#ver')) sheetVersion();
});
/* 계산 기록을 꾹 누르면 그 계산을 프리셋으로 (앞 숫자는 □ = 그때그때 넣는 숫자) */
let hHold = 0, hHeld = false;
el.vCalc.addEventListener('pointerdown', e => {
  const hr = e.target.closest('[data-hi]'); if (!hr) return;
  hHeld = false; clearTimeout(hHold);
  hHold = setTimeout(() => {
    const h = S.hist[+hr.dataset.hi]; if (!h || !h.e) return;
    const m = LEARN_RE.exec(h.e);
    let seed = null;
    if (m) { try { compile('□' + m[2]); seed = { e: h.e, tail: m[2] }; } catch (er) { seed = null; } }
    hHeld = true;
    if (!seed) { toast('숫자로 시작하는 계산만 프리셋으로 만들 수 있어요'); return; }
    try { navigator.vibrate && navigator.vibrate(15); } catch (er) { /* 무시 */ }
    sheetPresetEdit(null, seed);
  }, 520);
});
['pointerup', 'pointerleave', 'pointercancel', 'pointermove'].forEach(t => el.vCalc.addEventListener(t, ev => { if (t !== 'pointermove' || Math.abs(ev.movementY) > 6) clearTimeout(hHold); }));
el.vCalc.addEventListener('contextmenu', e => { if (e.target.closest('[data-hi]')) e.preventDefault(); });
el.vCalc.addEventListener('click', e => {
  const t = e.target;
  const hr = t.closest('[data-hi]');
  if (hr && hHeld) { hHeld = false; return; }
  if (hr) {
    const h = S.hist[+hr.dataset.hi];
    if (!h) return;
    const c = S.calc, r = h.xs || String(h.r);
    clearCur();
    if (!c.done && /[+\-*/(]$/.test(c.expr)) { c.expr += r; S.calc.err = ''; }
    else { c.expr = r; c.done = true; c.prev = h.e ? { e: h.e } : { l: h.l, x: h.x }; }
    return changed();
  }
  const hc = t.closest('[data-act="hclear"]');
  if (hc) {
    if (!hc.classList.contains('armed')) {
      hc.classList.add('armed'); hc.textContent = '한 번 더 누르면 지워요';
      setTimeout(() => { if (hc.isConnected) { hc.classList.remove('armed'); hc.textContent = '기록 지우기'; } }, 3000);
      return;
    }
    S.hist = [];
    return changed();
  }
  /* 결과 위의 식을 누르면 다시 불러와 고치기 */
  if (t.closest('#prevline') && S.calc.done && S.calc.prev && S.calc.prev.e) {
    const c = S.calc;
    c.expr = c.prev.e; c.done = false; c.prev = null; c.err = ''; clearCur();
    changed();
    return toast('식을 다시 불러왔어요. 고칠 숫자를 누르세요');
  }
  /* 입력 중인 식의 숫자를 누르면 그 숫자를 고른다 */
  const tk = t.closest('#expr [data-a]');
  if (tk && !S.calc.done) {
    const c = S.calc, a = +tk.dataset.a, b = +tk.dataset.b;
    if (tk.classList.contains('tn') && !(c.sel && c.sel[0] === a)) { c.sel = [a, b]; c.cur = null; }
    else { c.sel = null; c.cur = b >= c.expr.length ? null : b; }
    return renderCalc();
  }
  if (t.closest('#expr') && !S.calc.done && (S.calc.sel || S.calc.cur != null)) { clearCur(); return renderCalc(); }
  if (t.closest('[data-act="cx"]')) return sheetCx();
  if (t.closest('[data-act="cxswap"]')) { const c = S.cx, f = c.from; c.from = c.to; c.to = f; return changed(); }
  if (t.closest('#expr') && S.calc.done) { const v = edValue(S.calc); if (v != null) copyText(Math.abs(v) >= 1e15 && /^-?\d+(\.\d+)?$/.test(S.calc.expr) ? S.calc.expr : String(v)); }
});
el.fxlist.addEventListener('click', e => {
  if (e.target.closest('[data-act="cur"]')) return sheetCurrencies();
  if (e.target.closest('a')) return;
  const r = e.target.closest('.fxrow');
  if (r) fxSelect(r.dataset.code);
});
el.fxlist.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('fxrow')) { e.preventDefault(); fxSelect(e.target.dataset.code); }
});
el.fxRefresh.addEventListener('click', () => refreshRates(true));
$('#fxCopy').addEventListener('click', () => { const t = fxText(); if (t) copyText(t, '복사했어요 · ' + t); else toast('금액을 먼저 넣어 주세요'); });
el.fxAdd.addEventListener('click', () => sheetCurrencies());
el.newPreset.addEventListener('click', () => sheetPresetEdit(null));
el.plist.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, p = S.presets.find(q => q.id === b.dataset.pid);
  if (act === 'pcalc' && p) sheetPresetCalc(p);
  else if (act === 'pin' && p) { p.pin = !p.pin; changed(); toast(p.pin ? '계산기 칩에 보여요' : '칩에서 뺐어요'); }
  else if (act === 'pedit' && p) sheetPresetEdit(p);
  else if (act === 'pshare' && p) sharePreset(p);
  else if (act === 'pack') { const k = PACKS.find(x => x.id === b.dataset.pk); if (k) sheetPack(k); }
  else if (act === 'import') sheetImport('');
  else if (act === 'keep') keepLearned(b.dataset.k);
  else if (act === 'hide') { const L = S.learned[b.dataset.k]; if (L) { L.hide = true; changed(); toast('숨겼어요'); } }
  else if (act === 'restore') { BUILTIN.forEach(bp => { if (!S.presets.find(q => q.id === bp.id)) S.presets.push(clone(bp)); }); changed(); toast('기본 프리셋을 다시 넣었어요'); }
});
el.sheetWrap.addEventListener('click', e => { if (e.target.closest('[data-act="close"]')) closeSheet(); });
document.addEventListener('keydown', e => {
  if (sheetOpen) { if (e.key === 'Escape') closeSheet(); return; }
  const tg = e.target;
  if (tg && tg.closest && tg.closest('input, textarea')) return;
  if (e.metaKey || e.ctrlKey || e.altKey || S.tab === 'preset') return;
  if ((e.key === 'Enter' || e.key === ' ') && tg && tg.closest && tg.closest('button, [role="button"]')) return;
  let k = e.key;
  if ((k === 'ArrowLeft' || k === 'ArrowRight') && S.tab === 'calc' && !S.calc.done && S.calc.expr) {
    const c = S.calc, L = k === 'ArrowLeft';
    let p = c.sel ? (L ? c.sel[0] : c.sel[1]) : (c.cur == null ? c.expr.length : c.cur);
    p = Math.max(0, Math.min(c.expr.length, p + (L ? -1 : 1)));
    c.sel = null; c.cur = p >= c.expr.length ? null : p;
    e.preventDefault();
    return renderCalc();
  }
  if (k === 'Enter') k = '='; else if (k === 'Backspace') k = 'BS'; else if (k === 'Escape' || k === 'Delete') k = 'AC'; else if (k === 'x' || k === 'X') k = '*';
  if (/^\d$/.test(k) || ['+', '-', '*', '/', '%', '.', '=', 'BS', 'AC', '(', ')'].includes(k)) {
    e.preventDefault();
    press(k);
    const b = el.keys.querySelector(`[data-k="${k}"]`);
    if (b) { b.classList.add('press'); setTimeout(() => b.classList.remove('press'), 110); }
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flush();
  else { autoRefresh(); autoUpdateCheck(); }
});
window.addEventListener('pagehide', flush);

/* ───── 시작 ───── */
render();
setTimeout(() => { autoRefresh(); autoUpdateCheck(); }, 400);
})();
